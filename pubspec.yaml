name: bao_koss
description: BÂO-KOSS - application de placement de main-d'œuvre agricole qualifiée.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  firebase_storage: ^13.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons: 
  android: "launcher_icon"
  ios: true 
  image_path: "assets/images/bao_koss_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/bao_koss_logo.png